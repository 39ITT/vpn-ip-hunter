name: Cloudflare IP Hunter
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: pip install requests urllib3
    - name: Run Hunter
      run: python hunter.py
